<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Utility Bill Calculator Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-blue: #0066ff;
            --light-blue: #00a2ff;
            --deep-blue: #002266;
            --bg-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-color);
            color: var(--deep-blue);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Removed canvas background */

        .hero-container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(240, 248, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 102, 255, 0.2);
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 102, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.5);
            max-width: 800px;
            width: 90%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .logo-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.2), inset 0 0 15px rgba(0, 102, 255, 0.1);
            animation: spinRing 10s linear infinite;
            font-size: 40px;
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, var(--deep-blue), var(--primary-blue), var(--light-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        p.subtitle {
            font-family: 'Share Tech Mono', monospace;
            color: rgba(0, 34, 102, 0.7);
            font-size: 1.1rem;
            letter-spacing: 3px;
            line-height: 1.6;
            margin-bottom: 50px;
        }

        .cta-btn {
            display: inline-block;
            text-decoration: none;
            padding: 20px 50px;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            letter-spacing: 4px;
            font-weight: 700;
            color: var(--primary-blue);
            background: rgba(0, 102, 255, 0.05);
            border: 2px solid var(--primary-blue);
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0, 119, 255, 0.2);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .cta-btn:hover {
            background: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(0, 102, 255, 0.3);
            transform: scale(1.05);
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: rgba(0, 34, 102, 0.6);
            letter-spacing: 2px;
        }

        .features span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── CORNER DECORATIONS ── */
        .corner-deco {
            position: absolute;
            width: 20px;
            height: 20px;
        }

        .corner-deco.tl { top: 15px; left: 15px; border-top: 2px solid var(--primary-blue); border-left: 2px solid var(--primary-blue); }
        .corner-deco.tr { top: 15px; right: 15px; border-top: 2px solid var(--primary-blue); border-right: 2px solid var(--primary-blue); }
        .corner-deco.bl { bottom: 15px; left: 15px; border-bottom: 2px solid var(--primary-blue); border-left: 2px solid var(--primary-blue); }
        .corner-deco.br { bottom: 15px; right: 15px; border-bottom: 2px solid var(--primary-blue); border-right: 2px solid var(--primary-blue); }

    </style>
</head>
<body>


    <div class="hero-container">
        <div class="corner-deco tl"></div>
        <div class="corner-deco tr"></div>
        <div class="corner-deco bl"></div>
        <div class="corner-deco br"></div>

        <div class="logo-ring">⚡</div>
        <h1>UTILITY BILL SUITE</h1>
        <p class="subtitle">CALCULATE, TRACK, AND MANAGE ALL YOUR MONTHLY UTILITY EXPENSES IN ONE PREMIUM INTERFACE.</p>

        <a href="/calculator" class="cta-btn">ENTER SUITE ▶</a>

        <div class="features">
            <span>⚡ ELECTRICITY</span>
            <span>💧 WATER</span>
            <span>🔥 GAS</span>
            <span>📡 INTERNET</span>
        </div>
    </div>

</body>
</html>
